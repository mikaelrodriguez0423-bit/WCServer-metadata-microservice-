<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Project: File Metadata Microservice</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Typography */
    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: #222;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      color: #222;
    }

    p {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 24px;
      color: #444;
    }

    /* Form Container */
    form {
      background-color: #ffffff;
      border: 1px solid #d1d9e6;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Inputs */
    input[type="file"] {
      font-size: 1rem;
      width: 100%;
      max-width: 400px;
    }

    input[type="submit"] {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      font-size: 1rem;
      background-color: #ffffff;
      border: 1px solid #d1d9e6;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    input[type="submit"]:hover {
      background-color: #e2e8f0;
    }

    /* Footer */
    footer {
      margin-top: 60px;
      font-size: 1rem;
      color: #555;
    }

    footer a {
      color: #3182ce;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main>
    <h1>API Project: File Metadata Microservice</h1>

    <h2>Usage:</h2>
    <p>Please Upload a File ...</p>

    <form action="/api/fileanalyse" method="POST" enctype="multipart/form-data">
      <input type="file" name="upfile" required />
      <input type="submit" value="Upload" />
    </form>
  </main>

  <footer>
    <p>by <a href="https://www.freecodecamp.org" target="_blank">freeCodeCamp</a></p>
  </footer>

</body>

</html>
